ID: object-store-file-manager
_schema-version: '3.3.0'
version: 1.0.0
description: SAP BTP Object Store File Manager

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci --prefix srv
        - npm run build:backend
        - npm ci --prefix app

modules:

  # ── Backend CAP ──────────────────────────────────────────────────────────────
  - name: object-store-file-manager-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: npm
    requires:
      - name: object-store-file-manager-xsuaa
      - name: object-store-file-manager-objectstore
      - name: object-store-file-manager-dest
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # ── Frontend deployer (HTML5 Application Repository) ─────────────────────────
  - name: object-store-file-manager-ui-deployer
    type: com.sap.application.content
    path: app
    requires:
      - name: object-store-file-manager-html5repo
        parameters:
          content-target: true
    build-parameters:
      builder: custom
      commands:
        - npm run build:mta
      build-result: deploy

  # ── Destination content ───────────────────────────────────────────────────────
  # Cria destinations no instance do destination service via MTA content deployer.
  # Padrão: content.instance (não subaccount) — compatível com SAP Build Work Zone.
  - name: object-store-file-manager-dest-content
    type: com.sap.application.content
    requires:
      - name: object-store-file-manager-dest
        parameters:
          content-target: true
      - name: object-store-file-manager-html5repo
        parameters:
          service-key:
            name: object-store-file-manager-html5repo-key
      - name: object-store-file-manager-xsuaa
        parameters:
          service-key:
            name: object-store-file-manager-xsuaa-key
      - name: srv-api
    parameters:
      content:
        instance:
          destinations:
            - Name: object-store-file-manager-backend
              Authentication: OAuth2UserTokenExchange
              TokenServiceInstanceName: object-store-file-manager-xsuaa
              TokenServiceKeyName: object-store-file-manager-xsuaa-key
              URL: ~{srv-api/srv-url}
              sap.cloud.service: com.presales.objectstorefilemanager
            - Name: object-store-file-manager-html5repo
              ServiceInstanceName: object-store-file-manager-html5repo
              ServiceKeyName: object-store-file-manager-html5repo-key
              sap.cloud.service: com.presales.objectstorefilemanager
          existing_destinations_policy: update
    build-parameters:
      no-source: true

resources:

  # ── XSUAA ────────────────────────────────────────────────────────────────────
  - name: object-store-file-manager-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: object-store-file-manager-${org}-${space}
        tenant-mode: dedicated

  # ── HTML5 Application Repository ─────────────────────────────────────────────
  - name: object-store-file-manager-html5repo
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  # ── Destination Service ───────────────────────────────────────────────────────
  - name: object-store-file-manager-dest
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        version: 1.0.0
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update

  # ── Object Store (S3-compatible) ──────────────────────────────────────────────
  # Service key gerado automaticamente pelo MTA deployer.
  # Campos expostos pelo binding SAP BTP Object Store (s3-standard):
  #   credentials.access_key_id     — AWS Access Key ID
  #   credentials.secret_access_key — AWS Secret Access Key
  #   credentials.bucket            — Nome do bucket
  #   credentials.host              — Endpoint S3 (ex: s3.amazonaws.com ou regional)
  #   credentials.region            — Região AWS (ex: eu-central-1)
  #   credentials.uri               — URI completa s3://<bucket>
  - name: object-store-file-manager-objectstore
    type: org.cloudfoundry.managed-service
    parameters:
      service: objectstore
      service-plan: s3-standard
